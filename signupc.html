<!DOCTYPE html>
<html lang="en">
<head>
<title>Flavours | Customer sign up</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="font.css">
<link rel="stylesheet" href="style-extra.css">
</head>
<body>
<header>
  <a class="logo" href="index.html">Flavours</a>
  <a href="login.html">Login</a>
  <a href="signup.html">Sign up</a>
</header>

<main>
  <section class="auth">
    <h2>Sign up</h2>
    <form action="#" method="post">
      <input type="text" name="username" placeholder="Username/Email" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" name="password2" placeholder="Enter Password again" required>
      <button type="submit">Sign Up as Customer</button>
    </form>
    <p style="font-size:11px">Already have an account? <a href="login.html">Log in</a></p>
  </section>
</main>
</body>
</html>
